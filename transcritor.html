<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcritor de Áudio/Vídeo</title>
    
    <!-- Fonte Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #737373;
            --border-color: #e5e5e5;
            --accent-color: #1a1a1a;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 24px;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
            font-weight: 400;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .settings-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
        }

        .settings-toggle:hover {
            background: var(--bg-primary);
        }

        .settings-toggle h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .settings-content {
            display: none;
            margin-top: 1rem;
        }

        .settings-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        input[type="text"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9375rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-xl);
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg-primary);
        }

        .dropzone:hover,
        .dropzone.dragover {
            border-color: var(--accent-color);
            background: rgba(26, 26, 26, 0.02);
        }

        .dropzone-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .dropzone-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .dropzone-hint {
            font-size: 0.875rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn-group .btn {
            flex: 1;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            border-radius: var(--radius-lg);
            margin-top: 1rem;
            font-size: 0.9375rem;
        }

        .status-info {
            background: rgba(59, 130, 246, 0.1);
            color: #2563eb;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .history-section {
            margin-top: 2rem;
        }

        .history-item {
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: var(--bg-primary);
            border-color: var(--accent-color);
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .history-item-name {
            font-weight: 600;
            font-size: 0.9375rem;
        }

        .history-item-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .history-item-preview {
            font-size: 0.875rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hidden {
            display: none;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            margin-top: 1rem;
        }

        .file-icon {
            font-size: 1.5rem;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            font-size: 0.9375rem;
        }

        .file-size {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .remove-file {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0.25rem;
            transition: color 0.2s ease;
        }

        .remove-file:hover {
            color: var(--error-color);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .card {
                padding: 1.5rem;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Transcritor</h1>
            <p class="subtitle">Transcreva áudios e vídeos com IA</p>
        </header>

        <!-- Configurações -->
        <div class="settings-toggle" onclick="toggleSettings()">
            <h3>⚙️ Configurações da API</h3>
            <span id="settings-icon">▼</span>
        </div>

        <div class="card settings-content" id="settings-content">
            <div class="form-group">
                <label for="api-key">Chave da API Google Gemini</label>
                <input 
                    type="password" 
                    id="api-key" 
                    placeholder="Cole sua API Key aqui"
                >
                <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem;">
                    Sua chave é salva apenas no seu navegador. 
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: var(--accent-color);">Obtenha uma grátis aqui</a>
                </p>
            </div>

            <div class="form-group">
                <label for="model">Modelo</label>
                <select id="model">
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash (Rápido)</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (Preciso)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="language">Idioma</label>
                <select id="language">
                    <option value="pt-BR">Português (Brasil)</option>
                    <option value="en-US">Inglês (EUA)</option>
                    <option value="es-ES">Espanhol</option>
                    <option value="fr-FR">Francês</option>
                    <option value="de-DE">Alemão</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="saveSettings()">Salvar Configurações</button>
        </div>

        <!-- Upload -->
        <div class="card">
            <div class="dropzone" id="dropzone">
                <div class="dropzone-icon">📁</div>
                <p class="dropzone-text">Arraste e solte seu arquivo aqui</p>
                <p class="dropzone-hint">MP3, WAV, MP4, MOV, WebM (até 20MB)</p>
                <input type="file" id="file-input" accept=".mp3,.wav,.mp4,.mov,.webm,.ogg,.m4a" style="display: none;">
            </div>

            <div id="file-info" class="file-info hidden">
                <span class="file-icon">🎵</span>
                <div class="file-details">
                    <div class="file-name" id="file-name"></div>
                    <div class="file-size" id="file-size"></div>
                </div>
                <button class="remove-file" onclick="removeFile()">✕</button>
            </div>

            <div id="status" class="status hidden"></div>

            <button class="btn btn-primary" id="transcribe-btn" onclick="transcribe()" disabled>
                Transcrever
            </button>

            <div id="result-section" class="hidden" style="margin-top: 1.5rem;">
                <label>Transcrição</label>
                <textarea id="transcription-result" readonly></textarea>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="copyToClipboard()">
                        📋 Copiar
                    </button>
                    <button class="btn btn-primary" onclick="downloadTXT()">
                        💾 Baixar .txt
                    </button>
                </div>
            </div>
        </div>

        <!-- Histórico -->
        <div class="history-section">
            <h3 style="font-size: 1.25rem; margin-bottom: 1rem;">Histórico Recente</h3>
            <div id="history-list"></div>
        </div>

        <footer>
            <p>Feito com Space Grotesk • Dados salvos localmente</p>
        </footer>
    </div>

    <script>
        // Estado global
        let selectedFile = null;
        let transcriptionHistory = [];

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            loadHistory();
            setupDropzone();
        });

        // Configurações
        function toggleSettings() {
            const content = document.getElementById('settings-content');
            const icon = document.getElementById('settings-icon');
            content.classList.toggle('active');
            icon.textContent = content.classList.contains('active') ? '▲' : '▼';
        }

        function loadSettings() {
            const apiKey = localStorage.getItem('gemini_api_key');
            const model = localStorage.getItem('gemini_model');
            const language = localStorage.getItem('gemini_language');

            if (apiKey) document.getElementById('api-key').value = apiKey;
            if (model) document.getElementById('model').value = model;
            if (language) document.getElementById('language').value = language;
        }

        function saveSettings() {
            const apiKey = document.getElementById('api-key').value.trim();
            const model = document.getElementById('model').value;
            const language = document.getElementById('language').value;

            if (!apiKey) {
                showStatus('Por favor, insira uma API Key', 'error');
                return;
            }

            localStorage.setItem('gemini_api_key', apiKey);
            localStorage.setItem('gemini_model', model);
            localStorage.setItem('gemini_language', language);

            showStatus('Configurações salvas!', 'success');
            setTimeout(() => {
                toggleSettings();
            }, 1000);
        }

        // Dropzone
        function setupDropzone() {
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('file-input');

            dropzone.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });

            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('dragover');
            });

            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
                
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
        }

        function handleFile(file) {
            const maxSize = 20 * 1024 * 1024; // 20MB
            
            if (file.size > maxSize) {
                showStatus('Arquivo muito grande. Máximo: 20MB', 'error');
                return;
            }

            selectedFile = file;
            
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-size').textContent = formatFileSize(file.size);
            document.getElementById('file-info').classList.remove('hidden');
            document.getElementById('dropzone').classList.add('hidden');
            document.getElementById('transcribe-btn').disabled = false;
            document.getElementById('result-section').classList.add('hidden');
            
            showStatus('Arquivo pronto para transcrição', 'info');
        }

        function removeFile() {
            selectedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-info').classList.add('hidden');
            document.getElementById('dropzone').classList.remove('hidden');
            document.getElementById('transcribe-btn').disabled = true;
            document.getElementById('result-section').classList.add('hidden');
            hideStatus();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Transcrição
        async function transcribe() {
            const apiKey = localStorage.getItem('gemini_api_key');
            
            if (!apiKey) {
                showStatus('Configure sua API Key nas configurações', 'error');
                toggleSettings();
                return;
            }

            if (!selectedFile) {
                showStatus('Selecione um arquivo primeiro', 'error');
                return;
            }

            const model = localStorage.getItem('gemini_model') || 'gemini-1.5-flash';
            const language = localStorage.getItem('gemini_language') || 'pt-BR';

            setTranscribing(true);
            showStatus('Analisando áudio/vídeo...', 'info');

            try {
                // Converter arquivo para Base64
                const base64Data = await fileToBase64(selectedFile);
                const mimeType = selectedFile.type;

                // Preparar payload para Gemini
                const payload = {
                    contents: [{
                        parts: [
                            { text: `Transcreva este áudio/vídeo em ${language}. Seja preciso e mantenha a pontuação adequada.` },
                            {
                                inline_data: {
                                    mime_type: mimeType,
                                    data: base64Data.split(',')[1] // Remover prefixo data:...
                                }
                            }
                        ]
                    }]
                };

                // Chamar API do Gemini
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    }
                );

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'Erro na API');
                }

                const result = await response.json();
                const transcription = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (!transcription) {
                    throw new Error('Nenhuma transcrição gerada');
                }

                // Mostrar resultado
                document.getElementById('transcription-result').value = transcription;
                document.getElementById('result-section').classList.remove('hidden');
                
                showStatus('Transcrição concluída!', 'success');

                // Salvar no histórico
                addToHistory(selectedFile.name, transcription);

            } catch (error) {
                console.error('Erro:', error);
                showStatus(`Erro: ${error.message}`, 'error');
            } finally {
                setTranscribing(false);
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function setTranscribing(isTranscribing) {
            const btn = document.getElementById('transcribe-btn');
            btn.disabled = isTranscribing;
            
            if (isTranscribing) {
                btn.innerHTML = '<span class="spinner"></span> Transcrevendo...';
            } else {
                btn.textContent = 'Transcrever';
            }
        }

        // Status
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status status-${type}`;
            statusEl.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('status').classList.add('hidden');
        }

        // Resultado
        function copyToClipboard() {
            const text = document.getElementById('transcription-result').value;
            navigator.clipboard.writeText(text).then(() => {
                showStatus('Copiado para a área de transferência!', 'success');
            }).catch(() => {
                showStatus('Erro ao copiar', 'error');
            });
        }

        function downloadTXT() {
            const text = document.getElementById('transcription-result').value;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `transcricao_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showStatus('Arquivo .txt baixado!', 'success');
        }

        // Histórico
        function addToHistory(fileName, transcription) {
            const item = {
                id: Date.now(),
                fileName,
                transcription,
                date: new Date().toISOString()
            };

            transcriptionHistory.unshift(item);
            
            // Manter apenas os últimos 10 itens
            if (transcriptionHistory.length > 10) {
                transcriptionHistory = transcriptionHistory.slice(0, 10);
            }

            localStorage.setItem('transcription_history', JSON.stringify(transcriptionHistory));
            renderHistory();
        }

        function loadHistory() {
            const saved = localStorage.getItem('transcription_history');
            if (saved) {
                transcriptionHistory = JSON.parse(saved);
                renderHistory();
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            
            if (transcriptionHistory.length === 0) {
                list.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.875rem;">Nenhuma transcrição recente</p>';
                return;
            }

            list.innerHTML = transcriptionHistory.map(item => {
                const date = new Date(item.date).toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const preview = item.transcription.substring(0, 100) + '...';

                return `
                    <div class="history-item" onclick="loadFromHistory(${item.id})">
                        <div class="history-item-header">
                            <span class="history-item-name">📄 ${item.fileName}</span>
                            <span class="history-item-date">${date}</span>
                        </div>
                        <div class="history-item-preview">${preview}</div>
                    </div>
                `;
            }).join('');
        }

        function loadFromHistory(id) {
            const item = transcriptionHistory.find(i => i.id === id);
            if (item) {
                document.getElementById('transcription-result').value = item.transcription;
                document.getElementById('result-section').classList.remove('hidden');
                window.scrollTo({ top: document.getElementById('result-section').offsetTop - 100, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
