# Configuração Global do Instagram Scanner

# Paths
output_base: "D:/ARQUIVOS/Documents/Projetos Antigravity/.agent/skills/specialized/instagram-scanner/output"
cache_dir: "D:/ARQUIVOS/Documents/Projetos Antigravity/.agent/skills/specialized/instagram-scanner/cache"
database_path: "D:/ARQUIVOS/Documents/Projetos Antigravity/.agent/skills/specialized/instagram-scanner/data/feature_store.duckdb"

# Rate Limiting
request_delay_ms: 2000
max_retries: 3
backoff_factor: 2
timeout_seconds: 60

# Coleta
default_posts_fast: 12
default_posts_full: 60
default_posts_deep: 100
scroll_delay_ms: 500
screenshot_enabled: true
html_raw_save: true

# Autenticação (opcional)
auth_mode: "public"  # public ou authenticated
cookies_file: null  # caminho para arquivo de cookies JSON se usar auth

# Scoring
score_weights:
  POSICIONAMENTO: 1.5
  BIO: 1.2
  OFERTA: 1.5
  CONVERSAO: 1.3
  AUTORIDADE: 1.2
  PROVA: 1.3
  CONTEUDO: 1.0
  RETENCAO: 1.1
  ESTETICA: 1.0
  CONSISTENCIA: 1.2

min_posts_for_score: 6

# Hashtags
hashtag_blacklist_path: "resources/hashtag_blacklist.txt"
min_hashtag_performance_posts: 10
shadowban_check_enabled: true

# Temporal
default_analysis_days: 90
min_posts_for_temporal: 20

# Benchmark
max_competitors: 10
min_competitors: 3

# Logging
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
log_format: "json"  # json ou text
log_file: "scanner.log"

# Qualidade de Dados
enable_data_quality_checks: true
dq_fail_on_missing_bio: false
dq_fail_on_empty_posts: false
dq_min_fill_rate: 0.7

# Exportação
export_formats:
  - json
  - txt
  - csv
include_raw_data: false
compress_old_runs: true
compress_after_days: 7
